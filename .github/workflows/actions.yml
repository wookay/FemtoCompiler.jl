# https://github.com/julia-actions/cache#usage
name: CI

on:
  push:
    paths-ignore:
      - README.md
      - 'docs/**'
  pull_request:

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

jobs:
  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: [nightly]
        julia-arch: [x64]
        os: [ubuntu-latest]
        include:
          - julia-version: 1.12.5       # 2026-02-09
            os: ubuntu-latest
          - julia-version: 1.11.9       # 2026-02-08
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: julia-actions/setup-julia@v1
      with:
        version: ${{ matrix.julia-version }}
    - uses: julia-actions/cache@v1
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-runtest@v1

    - name: gen/check_for_updates_using_sugar_cubes.jl
      if: ${{ matrix.julia-version == '1.12.5' }}
      run: |
        git clone --depth=1 --filter=blob:none --sparse https://github.com/JuliaLang/julia sources
        cd sources/
        git sparse-checkout set JuliaSyntax
        cd ../

        git clone --depth=1 https://github.com/wookay/SugarCubes.jl SugarCubes.jl
        cd SugarCubes.jl/
        ln -s ../sources/
        cd ../
        julia -e 'using Pkg; Pkg.develop(path="SugarCubes.jl")'

        cd gen/
        julia check_for_updates_using_sugar_cubes.jl
        cd ../

    - name: trace-compile-timing
      if: ${{ matrix.julia-version == '1.12.5' || matrix.julia-version == 'nightly' }}
      run: |
           julia -e 'using Pkg; Pkg.develop(path=".")'
           julia -e 'using Pkg; Pkg.add("Jive")'
           cd test/
           julia --trace-compile-timing --trace-compile=stderr --compiled-modules=yes --color=yes runtests.jl
           cd ../
